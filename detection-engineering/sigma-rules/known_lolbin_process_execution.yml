title: Known LOLBin Process Execution
id: 44bb78b8-a978-5e60-b40b-38e44acba93b
status: experimental
description: Detects execution of a binary commonly abused for living-off-the-land
  attacks (LOLBins). Matches the heuristic in shield-detect/process_monitor.py.
author: python-for-cybersecurity project
date: 2026/08/27
references:
- https://lolbas-project.github.io/
tags:
- attack.execution
- attack.t1059
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - \powershell.exe
    - \cmd.exe
    - \wscript.exe
    - \cscript.exe
    - \mshta.exe
    - \certutil.exe
    - \regsvr32.exe
    - \rundll32.exe
  condition: selection
falsepositives:
- Legitimate administrative scripts and scheduled tasks
level: medium
