<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="ccBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <filter id="ccGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="440" rx="18" fill="url(#ccBg)"/>

  <text x="450" y="31" font-size="14" fill="#a7a9be" text-anchor="middle">case-management/case_manager.py — an alert is not an investigation</text>
  <text x="450" y="50" font-size="11" fill="#6f6d8c" text-anchor="middle">a design gap found by running the SOAR runner and auto-triage over the same live events — they disagreed about what an incident is</text>

  <!-- ===================== LEFT: the bug ===================== -->
  <text x="42" y="84" font-size="9.5" fill="#ff7a7a" letter-spacing="1.3">BEFORE — ONE CASE PER ALERT</text>
  <rect x="40" y="94" width="380" height="252" rx="10" fill="#1a1013" stroke="#5c2b2b"/>

  <!-- 4 alerts -->
  <g font-size="9.5" font-family="Consolas, Menlo, monospace">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.030;0.080;0.930;1" dur="12s" repeatCount="indefinite"/>
      <rect x="58" y="112" width="128" height="26" rx="5" fill="#2a1216" stroke="#ff5c5c"/>
      <text x="70" y="129" fill="#ff9b9b">event #72 HIGH</text>
      <rect x="274" y="112" width="128" height="26" rx="5" fill="#2a1216" stroke="#ff5c5c"/>
      <text x="286" y="129" fill="#ff9b9b">case #34</text>
      <line x1="190" y1="125" x2="268" y2="125" stroke="#5c2b2b" stroke-width="1.3"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.080;0.130;0.930;1" dur="12s" repeatCount="indefinite"/>
      <rect x="58" y="150" width="128" height="26" rx="5" fill="#2a1216" stroke="#ff5c5c"/>
      <text x="70" y="167" fill="#ff9b9b">event #73 HIGH</text>
      <rect x="274" y="150" width="128" height="26" rx="5" fill="#2a1216" stroke="#ff5c5c"/>
      <text x="286" y="167" fill="#ff9b9b">case #35</text>
      <line x1="190" y1="163" x2="268" y2="163" stroke="#5c2b2b" stroke-width="1.3"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.130;0.180;0.930;1" dur="12s" repeatCount="indefinite"/>
      <rect x="58" y="188" width="128" height="26" rx="5" fill="#2a1216" stroke="#ff5c5c"/>
      <text x="70" y="205" fill="#ff9b9b">event #74 HIGH</text>
      <rect x="274" y="188" width="128" height="26" rx="5" fill="#2a1216" stroke="#ff5c5c"/>
      <text x="286" y="205" fill="#ff9b9b">case #36</text>
      <line x1="190" y1="201" x2="268" y2="201" stroke="#5c2b2b" stroke-width="1.3"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.180;0.230;0.930;1" dur="12s" repeatCount="indefinite"/>
      <rect x="58" y="226" width="128" height="26" rx="5" fill="#2a1216" stroke="#ff5c5c"/>
      <text x="70" y="243" fill="#ff9b9b">event #75 HIGH</text>
      <rect x="274" y="226" width="128" height="26" rx="5" fill="#2a1216" stroke="#ff5c5c"/>
      <text x="286" y="243" fill="#ff9b9b">case #37</text>
      <line x1="190" y1="239" x2="268" y2="239" stroke="#5c2b2b" stroke-width="1.3"/>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.240;0.300;0.930;1" dur="12s" repeatCount="indefinite"/>
    <text x="230" y="285" font-size="11.5" fill="#ff9b9b" text-anchor="middle" font-weight="bold">4 alerts → 4 cases</text>
    <text x="230" y="305" font-size="10" fill="#a7a9be" text-anchor="middle">the same alert list the analyst had before</text>
    <text x="230" y="320" font-size="10" fill="#a7a9be" text-anchor="middle">case management existed — with case</text>
    <text x="230" y="335" font-size="10" fill="#a7a9be" text-anchor="middle">numbers printed on it</text>
  </g>

  <!-- ===================== RIGHT: the fix ===================== -->
  <text x="482" y="84" font-size="9.5" fill="#7ee8b8" letter-spacing="1.3">AFTER — CORRELATE BEFORE CREATING</text>
  <rect x="480" y="94" width="380" height="252" rx="10" fill="#0d1a14" stroke="#235c42"/>

  <!-- 4 alerts converging -->
  <g font-size="9.5" font-family="Consolas, Menlo, monospace">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.330;0.380;0.930;1" dur="12s" repeatCount="indefinite"/>
      <rect x="498" y="112" width="128" height="26" rx="5" fill="#13241c" stroke="#2cb67d"/>
      <text x="510" y="129" fill="#7ee8b8">event #72 HIGH</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.380;0.420;0.930;1" dur="12s" repeatCount="indefinite"/>
      <rect x="498" y="150" width="128" height="26" rx="5" fill="#13241c" stroke="#2cb67d"/>
      <text x="510" y="167" fill="#7ee8b8">event #73 HIGH</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.420;0.460;0.930;1" dur="12s" repeatCount="indefinite"/>
      <rect x="498" y="188" width="128" height="26" rx="5" fill="#13241c" stroke="#2cb67d"/>
      <text x="510" y="205" fill="#7ee8b8">event #74 HIGH</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.460;0.500;0.930;1" dur="12s" repeatCount="indefinite"/>
      <rect x="498" y="226" width="128" height="26" rx="5" fill="#13241c" stroke="#2cb67d"/>
      <text x="510" y="243" fill="#7ee8b8">event #75 HIGH</text>
    </g>
  </g>

  <!-- converging connectors -->
  <g stroke="#2cb67d" stroke-width="1.4" fill="none" opacity="0">
    <animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.380;0.520;0.930;1" dur="12s" repeatCount="indefinite"/>
    <path d="M630,125 C672,125 672,182 710,182"/>
    <path d="M630,163 C668,163 668,182 710,182"/>
    <path d="M630,201 C668,201 668,182 710,182"/>
    <path d="M630,239 C672,239 672,182 710,182"/>
  </g>

  <!-- the single case -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.510;0.560;0.930;1" dur="12s" repeatCount="indefinite"/>
    <rect x="712" y="142" width="130" height="80" rx="8" fill="#13241c" stroke="#2cb67d" stroke-width="1.6" filter="url(#ccGlow)"/>
    <text x="777" y="168" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="bold">Case #34</text>
    <text x="777" y="188" font-size="10.5" fill="#7ee8b8" text-anchor="middle">HIGH · 4 events</text>
    <text x="777" y="206" font-size="9.5" fill="#a7a9be" text-anchor="middle">one investigation</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.570;0.630;0.930;1" dur="12s" repeatCount="indefinite"/>
    <text x="670" y="285" font-size="11.5" fill="#7ee8b8" text-anchor="middle" font-weight="bold">4 alerts → 1 case</text>
    <text x="670" y="305" font-size="10" fill="#a7a9be" text-anchor="middle">both the SOAR runner and --auto-triage now</text>
    <text x="670" y="320" font-size="10" fill="#a7a9be" text-anchor="middle">correlate on the same (source, technique) key,</text>
    <text x="670" y="335" font-size="10" fill="#a7a9be" text-anchor="middle">so a burst converges whichever gets there first</text>
  </g>

  <!-- ===================== footer rules ===================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.650;0.710;0.930;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="362" width="258" height="56" rx="8" fill="#141a26" stroke="#2a2f3a"/>
    <text x="54" y="382" font-size="10.5" fill="#e6edf3" font-weight="bold">Severity escalates, never drops</text>
    <text x="54" y="398" font-size="9.5" fill="#a7a9be">a case holding a HIGH alert does not</text>
    <text x="54" y="410" font-size="9.5" fill="#a7a9be">become MEDIUM when a quieter one joins</text>

    <rect x="310" y="362" width="258" height="56" rx="8" fill="#141a26" stroke="#2a2f3a"/>
    <text x="324" y="382" font-size="10.5" fill="#e6edf3" font-weight="bold">Closing requires a disposition</text>
    <text x="324" y="398" font-size="9.5" fill="#a7a9be">a hard error, not a default — it is the only</text>
    <text x="324" y="410" font-size="9.5" fill="#a7a9be">feedback detection engineering ever gets</text>

    <rect x="580" y="362" width="280" height="56" rx="8" fill="#141a26" stroke="#2a2f3a"/>
    <text x="594" y="382" font-size="10.5" fill="#e6edf3" font-weight="bold">Idempotent on a timer</text>
    <text x="594" y="398" font-size="9.5" fill="#a7a9be">an event already linked is never pulled into</text>
    <text x="594" y="410" font-size="9.5" fill="#a7a9be">a second case — re-running changes nothing</text>
  </g>
</svg>
