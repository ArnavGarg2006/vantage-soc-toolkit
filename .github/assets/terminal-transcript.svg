<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, monospace">
  <defs>
    <linearGradient id="termOuterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <clipPath id="clipL1"><rect x="46" y="108" width="0" height="26"><animate attributeName="width" values="0;0;500;500;0" keyTimes="0;0;0.067;0.956;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipL2"><rect x="30" y="136" width="0" height="26"><animate attributeName="width" values="0;0;460;460;0" keyTimes="0;0.178;0.256;0.956;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipL3"><rect x="30" y="164" width="0" height="26"><animate attributeName="width" values="0;0;280;280;0" keyTimes="0;0.256;0.344;0.956;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipL4"><rect x="30" y="192" width="0" height="26"><animate attributeName="width" values="0;0;180;180;0" keyTimes="0;0.344;0.400;0.956;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipL5"><rect x="46" y="228" width="0" height="26"><animate attributeName="width" values="0;0;530;530;0" keyTimes="0;0.478;0.589;0.956;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipL6"><rect x="30" y="256" width="0" height="26"><animate attributeName="width" values="0;0;520;520;0" keyTimes="0;0.589;0.700;0.956;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect x="0" y="0" width="900" height="340" rx="18" fill="url(#termOuterBg)"/>
  <text x="450" y="30" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#a7a9be" text-anchor="middle">Not a mockup — this is the actual transcript from this session, replayed</text>

  <!-- terminal window: 70..320 = 250 tall, 20px margin below the title zone on
       both sides (title zone ends ~50) — previously 52..302 (38px bottom vs
       52px top+title), which read as visibly top-heavy/off-center -->
  <rect x="60" y="70" width="780" height="250" rx="10" fill="#0b0e14" stroke="#2a2f3a"/>
  <rect x="60" y="70" width="780" height="30" rx="10" fill="#1b1f2a"/>
  <rect x="60" y="90" width="780" height="10" fill="#1b1f2a"/>
  <circle cx="82" cy="85" r="6" fill="#ff5f56"/>
  <circle cx="102" cy="85" r="6" fill="#ffbd2e"/>
  <circle cx="122" cy="85" r="6" fill="#27c93f"/>
  <text x="450" y="89" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11" fill="#6f6d8c" text-anchor="middle">fs_watcher.py — python — 82×24</text>

  <g font-size="14">
    <!-- line 1: command -->
    <g clip-path="url(#clipL1)">
      <text x="46" y="126" fill="#58a6ff">$</text>
      <text x="62" y="126" fill="#e6edf3">python realtime-detection/fs_watcher.py --self-test</text>
    </g>
    <!-- line 2: header -->
    <g clip-path="url(#clipL2)">
      <text x="30" y="154" fill="#8b949e">=== Self-test: real-time notification latency ===</text>
    </g>
    <!-- line 3: result -->
    <g clip-path="url(#clipL3)">
      <text x="30" y="182" fill="#e6edf3">  Notification latency: <tspan fill="#2cb67d" font-weight="bold">0.4ms</tspan></text>
    </g>
    <!-- line 4: pass -->
    <g clip-path="url(#clipL4)">
      <text x="30" y="210" fill="#2cb67d" font-weight="bold">Self-test PASSED.</text>
    </g>
    <!-- line 5: command 2 -->
    <g clip-path="url(#clipL5)">
      <text x="46" y="246" fill="#58a6ff">$</text>
      <text x="62" y="246" fill="#e6edf3">python -c "wmi.WMI().Win32_ProcessStartTrace.watch_for()"</text>
    </g>
    <!-- line 6: honest failure -->
    <g clip-path="url(#clipL6)">
      <text x="30" y="274" fill="#ff5f56" font-weight="bold">x_access_denied()  # confirmed live — needs Administrator</text>
    </g>
  </g>

  <!-- blinking cursor, lit only after typing finishes, right after line 6 -->
  <rect x="562" y="263" width="9" height="16" fill="#e6edf3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0;1;0;1;0;0" keyTimes="0;0.700;0.72;0.76;0.80;0.84;0.88;0.92;0.956;0.96;1" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
