<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="radBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <filter id="radGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="460" rx="18" fill="url(#radBg)"/>
  <text x="450" y="34" font-size="14" fill="#a7a9be" text-anchor="middle">24 techniques mapped — one verified module per ATT&amp;CK/Shield tactic bucket, ring builds live</text>

  <!-- faint full-circle track -->
  <circle cx="290" cy="230" r="130" fill="none" stroke="#232842" stroke-width="14"/>

  <!-- 8 segments, each draws in, holds, then all reset together -->
  <g stroke-width="14" fill="none" stroke-linecap="round">
    <circle cx="290" cy="230" r="130" stroke="#7f5af0" stroke-dasharray="86.22 730.59" transform="rotate(-90,290,230)">
      <animate attributeName="stroke-dashoffset" values="86.22;86.22;0;0;86.22" keyTimes="0;0;0.056;0.867;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="230" r="130" stroke="#9d8cff" stroke-dasharray="86.22 730.59" transform="rotate(-45,290,230)">
      <animate attributeName="stroke-dashoffset" values="86.22;86.22;0;0;86.22" keyTimes="0;0.039;0.094;0.867;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="230" r="130" stroke="#58a6ff" stroke-dasharray="86.22 730.59" transform="rotate(0,290,230)">
      <animate attributeName="stroke-dashoffset" values="86.22;86.22;0;0;86.22" keyTimes="0;0.078;0.133;0.867;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="230" r="130" stroke="#2cb67d" stroke-dasharray="86.22 730.59" transform="rotate(45,290,230)">
      <animate attributeName="stroke-dashoffset" values="86.22;86.22;0;0;86.22" keyTimes="0;0.117;0.172;0.867;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="230" r="130" stroke="#7ee8b8" stroke-dasharray="86.22 730.59" transform="rotate(90,290,230)">
      <animate attributeName="stroke-dashoffset" values="86.22;86.22;0;0;86.22" keyTimes="0;0.156;0.211;0.867;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="230" r="130" stroke="#ffb84d" stroke-dasharray="86.22 730.59" transform="rotate(135,290,230)">
      <animate attributeName="stroke-dashoffset" values="86.22;86.22;0;0;86.22" keyTimes="0;0.194;0.25;0.867;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="230" r="130" stroke="#ff7a45" stroke-dasharray="86.22 730.59" transform="rotate(180,290,230)">
      <animate attributeName="stroke-dashoffset" values="86.22;86.22;0;0;86.22" keyTimes="0;0.233;0.289;0.867;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="230" r="130" stroke="#ff5f56" stroke-dasharray="86.22 730.59" transform="rotate(225,290,230)">
      <animate attributeName="stroke-dashoffset" values="86.22;86.22;0;0;86.22" keyTimes="0;0.272;0.328;0.867;1" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- center readout -->
  <g text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.328;0.348;0.867;1" dur="9s" repeatCount="indefinite"/>
    <text x="290" y="222" font-size="52" font-weight="bold" fill="#e6edf3">24</text>
    <text x="290" y="248" font-size="13" fill="#a7a9be">techniques verified</text>
  </g>

  <!-- segment labels, each fades in as its own arc completes -->
  <g font-size="12" fill="#a7a9be">
    <text x="345" y="69" text-anchor="start" opacity="0">Recon / Discovery
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.056;0.076;0.867;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <!-- Wrapped onto two lines: on one line this ran to x≈620 and collided
         with the right-hand panel. Caught by rendering the SVG and looking
         at it, not by reading the markup. -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.094;0.114;0.867;1" dur="9s" repeatCount="indefinite"/>
      <text x="441" y="150" text-anchor="start">Resource Dev /</text>
      <text x="441" y="166" text-anchor="start">Initial Access</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.133;0.153;0.867;1" dur="9s" repeatCount="indefinite"/>
      <text x="449" y="279" text-anchor="start">Persistence /</text>
      <text x="449" y="295" text-anchor="start">Priv Esc</text>
    </g>
    <text x="365" y="383" text-anchor="start" opacity="0">Defense Evasion / Lat. Move
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.172;0.192;0.867;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="235" y="391" text-anchor="end" opacity="0">Cred. Access / Collection
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.211;0.231;0.867;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="137" y="305" text-anchor="end" opacity="0">C2 / Exfiltration
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.27;0.867;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="129" y="175" text-anchor="end" opacity="0">Impact
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.289;0.309;0.867;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="216" y="77" text-anchor="end" opacity="0">Shield Ops
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.328;0.348;0.867;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="548" y="112" font-size="13" fill="#e0def4" font-weight="bold">Every segment ships with:</text>
  <text x="548" y="140" font-size="12" fill="#a7a9be">✓ a real attack simulation</text>
  <text x="548" y="164" font-size="12" fill="#a7a9be">✓ a paired detector</text>
  <text x="548" y="188" font-size="12" fill="#a7a9be">✓ live-verified output, not a template</text>

  <!-- The layer that sits ON TOP of the techniques. These are deliberately
       NOT counted as techniques — YARA, case management and SOAR are a
       response layer over the same 24, not 3 more ATT&CK entries. Inflating
       the ring would have been the easy, dishonest option. -->
  <line x1="548" y1="208" x2="860" y2="208" stroke="#2a2f3a" stroke-width="1"/>
  <text x="548" y="232" font-size="12" fill="#c4b5fd" font-weight="bold">And a response layer over all of them:</text>
  <text x="548" y="256" font-size="11.5" fill="#a7a9be">→ YARA rules for the file-side evidence</text>
  <text x="548" y="278" font-size="11.5" fill="#a7a9be">→ alerts become cases with a disposition</text>
  <text x="548" y="300" font-size="11.5" fill="#a7a9be">→ playbooks enrich and correlate them</text>
  <text x="548" y="322" font-size="10.5" fill="#6f6d8c">not counted above — a layer on the 24,</text>
  <text x="548" y="337" font-size="10.5" fill="#6f6d8c">not 3 more techniques</text>

  <text x="548" y="376" font-size="11" fill="#6f6d8c">22 of 33 modules verified by one command:</text>
  <text x="548" y="392" font-size="11" fill="#7ee8b8" font-family="Consolas, Menlo, monospace">python verify_all.py</text>
</svg>
